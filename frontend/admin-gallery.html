<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Admin | PR Decorations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-container { padding: 4rem 1rem; max-width: 900px; margin: 0 auto; }
    .upload-area {
      border: 2px dashed var(--line);
      border-radius: var(--radius-lg);
      padding: 3rem 2rem;
      text-align: center;
      background: var(--panel);
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-area:hover, .upload-area.dragover { border-color: var(--primary); background: var(--bg-soft); }
    .upload-area input { display: none; }
    
    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 3rem;
    }
    
    .admin-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    
    .admin-card img { width: 100%; height: 200px; object-fit: cover; }
    .admin-card-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
    
    .admin-card select { width: 100%; padding: 0.5rem; border-radius: var(--radius-sm); border: 1px solid var(--line); background: #fff; }
    
    .admin-actions { display: flex; gap: 0.5rem; }
    .admin-actions button { flex: 1; padding: 0.6rem; font-size: 0.85rem; border-radius: var(--radius-sm); border: none; cursor: pointer; font-weight: 600; }
    .btn-save { background: var(--success); color: white; }
    .btn-delete { background: var(--booked); color: white; }
    
    .status-unconfirmed { border-left: 5px solid var(--accent); }
    .status-confirmed { border-left: 5px solid var(--success); }
  </style>
</head>
<body>

  <div class="site-header">
    <div class="container nav-shell">
      <a href="/" class="brand">
        <div class="brand-mark">PR</div>
        <div>
          <strong>BookMyDecor</strong>
          <small>Admin Dashboard</small>
        </div>
      </a>
    </div>
  </div>

  <div class="admin-container">
    <div class="section-heading">
      <h2>Gallery AI Uploader</h2>
      <p class="subheading">Upload event photos. Claude AI will automatically classify them into categories.</p>
    </div>

    <div class="upload-area" id="upload-area">
      <h3 style="margin-top:0">Drag & Drop photos here</h3>
      <p>or click to browse</p>
      <input type="file" id="file-input" multiple accept="image/*">
      <button class="button button-primary" id="btn-upload" style="margin-top: 1rem; display: none;">Upload & Classify</button>
      <div id="upload-status" style="margin-top: 1rem; font-weight: 600;"></div>
    </div>

    <div class="admin-grid" id="admin-grid"></div>
  </div>

  <script src="config.js"></script>
  <script>
    const uploadArea = document.getElementById('upload-area');
    const fileInput = document.getElementById('file-input');
    const btnUpload = document.getElementById('btn-upload');
    const statusDiv = document.getElementById('upload-status');
    const grid = document.getElementById('admin-grid');

    const CATEGORIES = [
      "Marriage Decoration", "Birthday Decoration", "Home Decoration",
      "Naming Ceremony", "Sreemantham Ceremony", "Engagement Decoration",
      "Car Decoration", "Temple Decoration", "New Year Decoration",
      "Festival Decoration", "Uncategorized"
    ];

    let selectedFiles = [];

    // Drag and drop handlers
    uploadArea.addEventListener('click', (e) => {
      if(e.target !== btnUpload) fileInput.click();
    });
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    function handleFiles(files) {
      if (files.length === 0) return;
      selectedFiles = Array.from(files);
      statusDiv.textContent = \`\${selectedFiles.length} file(s) selected.\`;
      btnUpload.style.display = 'inline-block';
    }

    btnUpload.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (selectedFiles.length === 0) return;
      
      btnUpload.disabled = true;
      statusDiv.textContent = \`Uploading and classifying \${selectedFiles.length} image(s)... This may take a minute.\`;

      const formData = new FormData();
      selectedFiles.forEach(f => formData.append('images', f));

      try {
        const res = await fetch(\`\${API_BASE}/gallery/upload\`, {
          method: 'POST',
          body: formData
        });
        
        if (!res.ok) throw new Error('Upload failed');
        
        statusDiv.textContent = \`Successfully uploaded and classified \${selectedFiles.length} images!\`;
        selectedFiles = [];
        btnUpload.style.display = 'none';
        
        loadGallery();
      } catch (err) {
        statusDiv.textContent = \`Error: \${err.message}\`;
      } finally {
        btnUpload.disabled = false;
      }
    });

    async function loadGallery() {
      try {
        const res = await fetch(\`\${API_BASE}/gallery\`);
        const data = await res.json();
        renderGallery(data);
      } catch (err) {
        console.error("Failed to load gallery", err);
      }
    }

    function renderGallery(items) {
      grid.innerHTML = '';
      
      // Sort so unconfirmed are first
      items.sort((a, b) => (a.confirmed === b.confirmed) ? 0 : a.confirmed ? 1 : -1);

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = \`admin-card \${item.confirmed ? 'status-confirmed' : 'status-unconfirmed'}\`;
        
        let optionsHtml = CATEGORIES.map(c => 
          \`<option value="\${c}" \${c === item.category ? 'selected' : ''}>\${c}</option>\`
        ).join('');

        card.innerHTML = \`
          <img src="\${API_BASE}\${item.path}" alt="Decoration">
          <div class="admin-card-body">
            <select id="cat-\${item.id}">
              \${optionsHtml}
            </select>
            <div style="font-size: 0.75rem; color: var(--muted)">
              \${item.confirmed ? '✅ Confirmed' : '🤖 AI Guessed: ' + item.category}
            </div>
            <div class="admin-actions">
              <button class="btn-save" onclick="saveItem('\${item.id}')">Save & Confirm</button>
              <button class="btn-delete" onclick="deleteItem('\${item.id}')">Delete</button>
            </div>
          </div>
        \`;
        grid.appendChild(card);
      });
    }

    window.saveItem = async (id) => {
      const select = document.getElementById(\`cat-\${id}\`);
      const newCategory = select.value;
      const btn = select.nextElementSibling.nextElementSibling.querySelector('.btn-save');
      btn.textContent = 'Saving...';
      
      try {
        const res = await fetch(\`\${API_BASE}/gallery/\${id}\`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ category: newCategory })
        });
        
        if (res.ok) {
          loadGallery(); // reload to show updated status
        }
      } catch (err) {
        alert("Failed to save");
        btn.textContent = 'Save & Confirm';
      }
    };

    window.deleteItem = async (id) => {
      if (!confirm("Are you sure you want to delete this image?")) return;
      
      try {
        const res = await fetch(\`\${API_BASE}/gallery/\${id}\`, {
          method: 'DELETE'
        });
        if (res.ok) {
          loadGallery();
        }
      } catch (err) {
        alert("Failed to delete");
      }
    };

    // Initial load
    loadGallery();
  </script>
</body>
</html>
